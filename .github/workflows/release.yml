name: Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. v1.0.2)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create and push tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists, skipping tag creation"
          else
            git tag "$VERSION"
            git push origin "$VERSION"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK (for distribution)
        run: ./gradlew assembleDebug
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Verify APK was built
        run: |
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "✅ APK built successfully"
            ls -lh app/build/outputs/apk/debug/app-debug.apk
          else
            echo "❌ APK not found at expected location"
            find app/build/outputs -name "*.apk" -type f
            exit 1
          fi

      - name: Check if release already exists
        id: check_release
        run: |
          if gh release view "$VERSION" &>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.VERSION }}
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
          body: |
            # ${{ env.VERSION }} Release

            ## APK Download
            The APK file is attached below and ready for installation.

            ## Installation Instructions
            1. Download the `app-debug.apk` file from the assets below
            2. Transfer to your Android device or use ADB: `adb install app-debug.apk`
            3. Grant necessary permissions when prompted
            4. Launch the app from your device's app drawer

            ## Release Notes
            To add detailed release notes:
            1. Navigate to the GitHub Releases page for this repository
            2. Click on this release (${{ env.VERSION }})
            3. Click the "Edit" button
            4. Update the release description with features, bug fixes, and changes
            5. Click "Update release" to save
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Creation Summary
        if: steps.check_release.outputs.exists == 'false'
        run: |
          echo "✅ Release $VERSION created successfully!"
          echo "📦 APK: app-debug.apk"
          echo "🔗 View at: https://github.com/${{ github.repository }}/releases/tag/$VERSION"

      - name: Already Released
        if: steps.check_release.outputs.exists == 'true'
        run: |
          echo "⏭️  Release $VERSION already exists."
          echo "🔗 View at: https://github.com/${{ github.repository }}/releases/tag/$VERSION"
